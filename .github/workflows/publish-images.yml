name: Publish Deployment Images

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full clean commit verified by the caller
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build, scan and attest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: beta-images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      WEB_IMAGE: ghcr.io/eltancex/dawnlight-web
      API_IMAGE: ghcr.io/eltancex/dawnlight-api
      WORKER_IMAGE: ghcr.io/eltancex/dawnlight-worker
      SITE_MODE: preview
      SITE_ORIGIN: ${{ vars.WP9_SITE_ORIGIN || 'https://core.eltancex.top' }}
      API_ORIGIN: ${{ vars.WP9_API_ORIGIN || 'https://core.eltancex.top' }}
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 14
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0

      - name: Derive immutable build metadata
        id: metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          created="$(git show -s --format=%cI "$revision")"
          epoch="$(git show -s --format=%ct "$revision")"
          short_revision="${revision:0:12}"
          {
            echo "revision=$revision"
            echo "created=$created"
            echo "epoch=$epoch"
            echo "version=0.1.0-sha.$short_revision"
            echo "tag=sha-$revision"
            echo "source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Web
        id: build-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/Dockerfile.web
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.metadata.outputs.tag }}
          build-args: |
            IMAGE_CREATED=${{ steps.metadata.outputs.created }}
            IMAGE_REVISION=${{ steps.metadata.outputs.revision }}
            IMAGE_SOURCE=${{ steps.metadata.outputs.source }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.epoch }}
            NEXT_PUBLIC_SITE_MODE=${{ env.SITE_MODE }}
            NEXT_PUBLIC_SITE_ORIGIN=${{ env.SITE_ORIGIN }}
            NEXT_PUBLIC_API_ORIGIN=${{ env.API_ORIGIN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          sbom: true
          provenance: mode=max

      - name: Build and push API
        id: build-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/Dockerfile.services
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.metadata.outputs.tag }}
          build-args: |
            IMAGE_CREATED=${{ steps.metadata.outputs.created }}
            IMAGE_REVISION=${{ steps.metadata.outputs.revision }}
            IMAGE_SOURCE=${{ steps.metadata.outputs.source }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.epoch }}
          cache-from: type=gha,scope=services
          sbom: true
          provenance: mode=max

      - name: Build and push Worker
        id: build-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/Dockerfile.services
          target: worker
          platforms: linux/amd64
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ steps.metadata.outputs.tag }}
          build-args: |
            IMAGE_CREATED=${{ steps.metadata.outputs.created }}
            IMAGE_REVISION=${{ steps.metadata.outputs.revision }}
            IMAGE_SOURCE=${{ steps.metadata.outputs.source }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.epoch }}
          cache-from: type=gha,scope=services
          cache-to: type=gha,mode=max,scope=services
          sbom: true
          provenance: mode=max

      - name: Attest Web image
        id: attest-web
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.build-web.outputs.digest }}
          push-to-registry: true

      - name: Attest API image
        id: attest-api
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      - name: Attest Worker image
        id: attest-worker
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WORKER_IMAGE }}
          subject-digest: ${{ steps.build-worker.outputs.digest }}
          push-to-registry: true

      - name: Prepare scan reports
        shell: bash
        run: mkdir -p reports/image-scans

      - name: Scan Web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}@${{ steps.build-web.outputs.digest }}
          version: v0.74.0
          format: json
          output: reports/image-scans/web.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          timeout: 10m

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}@${{ steps.build-api.outputs.digest }}
          version: v0.74.0
          format: json
          output: reports/image-scans/api.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          timeout: 10m

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WORKER_IMAGE }}@${{ steps.build-worker.outputs.digest }}
          version: v0.74.0
          format: json
          output: reports/image-scans/worker.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          timeout: 10m

      - name: Evaluate vulnerability policy
        id: vulnerability-policy
        continue-on-error: true
        run: node scripts/check-image-vulnerabilities.mjs

      - name: Write deployment manifest
        env:
          IMAGE_REVISION: ${{ steps.metadata.outputs.revision }}
          IMAGE_CREATED: ${{ steps.metadata.outputs.created }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
          IMAGE_VERSION: ${{ steps.metadata.outputs.version }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
          IMAGE_SOURCE: ${{ steps.metadata.outputs.source }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.build-worker.outputs.digest }}
          WEB_ATTESTATION_URL: ${{ steps.attest-web.outputs.attestation-url }}
          API_ATTESTATION_URL: ${{ steps.attest-api.outputs.attestation-url }}
          WORKER_ATTESTATION_URL: ${{ steps.attest-worker.outputs.attestation-url }}
          VULNERABILITY_GATE_RESULT: ${{ steps.vulnerability-policy.outcome }}
        run: node scripts/create-ci-image-manifest.mjs

      - name: Enforce vulnerability policy
        if: steps.vulnerability-policy.outcome != 'success'
        shell: bash
        run: |
          echo "Vulnerability policy rejected this image set."
          exit 1

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-images-${{ inputs.source_sha }}
          path: |
            reports/wp9-ci-image-manifest.json
            reports/image-scans/
          if-no-files-found: warn
          retention-days: 90
