name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      site_origin:
        description: Canonical HTTPS origin without a trailing path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dawnlight-core-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      NEXT_PUBLIC_SITE_MODE: production
      NEXT_PUBLIC_SITE_ORIGIN: ${{ inputs.site_origin }}
      DEPLOY_PROVIDER: cloudflare-pages
      PRODUCTION_DOCS_VERSION: ${{ vars.PRODUCTION_DOCS_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:validate:production
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm deploy:prepare:production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dawnlight-core-production-${{ github.sha }}
          path: apps/web/out/
          if-no-files-found: error
          retention-days: 90
      - id: deploy
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/web/out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
      - env:
          SMOKE_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
          EXPECT_DEPLOY_HEADERS: "1"
        run: node scripts/smoke-deployment.mjs --mode production
