openapi: 3.1.0
info:
  title: DawnlightCore API
  version: 0.2.0-preview
  description: >-
    V2 API for public contract/directory reads and invitation-only author drafts.
    Author writes require an OIDC session, CSRF token, resource role and idempotency key.
servers:
  - url: http://127.0.0.1:4100
paths:
  /health/live:
    get:
      operationId: getHealthLive
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
  /health/ready:
    get:
      operationId: getHealthReady
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
        '503':
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
  /api/v1/contracts:
    get:
      operationId: listContracts
      responses:
        '200':
          description: Versioned contract snapshots.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ContractSummary' }
  /api/v1/contracts/diff:
    get:
      operationId: getContractDiff
      parameters:
        - { $ref: '#/components/parameters/FromVersion' }
        - { $ref: '#/components/parameters/ToVersion' }
      responses:
        '200':
          description: Contract entity set changes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContractDiff' }
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}:
    get:
      operationId: getContract
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
      responses:
        '200':
          description: Contract snapshot metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContractSummary' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}/diagnostics:
    get:
      operationId: listContractDiagnostics
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
      responses:
        '200':
          description: Diagnostics in this contract version.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DiagnosticRecord' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}/diagnostics/{code}:
    get:
      operationId: getContractDiagnostic
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: One diagnostic record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DiagnosticRecord' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '410': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}/catalog:
    get:
      operationId: listContractCatalog
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/CatalogKind' }
      responses:
        '200':
          description: Catalog records, optionally filtered by kind.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogRecord' }
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}/catalog/{kind}/{id}:
    get:
      operationId: getContractCatalogEntry
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
        - name: kind
          in: path
          required: true
          schema: { $ref: '#/components/schemas/CatalogKind' }
        - name: id
          in: path
          required: true
          description: URL-encoded stable catalog ID.
          schema: { type: string }
      responses:
        '200':
          description: One catalog record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CatalogRecord' }
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '410': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}/capabilities:
    get:
      operationId: listContractCapabilities
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
      responses:
        '200':
          description: Capability records.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CapabilityRecord' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}/capabilities/{id}:
    get:
      operationId: getContractCapability
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
        - name: id
          in: path
          required: true
          description: URL-encoded stable capability ID.
          schema: { type: string }
      responses:
        '200':
          description: One capability record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CapabilityRecord' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '410': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}/graph:
    get:
      operationId: getContractGraph
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
      responses:
        '200':
          description: Graph record. It can explicitly be unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GraphRecord' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/contracts/{contractVersion}/variant:
    get:
      operationId: getContractVariant
      parameters:
        - { $ref: '#/components/parameters/ContractVersion' }
      responses:
        '200':
          description: Variant explain record. It can explicitly be unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/VariantRecord' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/directory/projects:
    get:
      operationId: listDirectoryProjects
      parameters:
        - { $ref: '#/components/parameters/DirectoryQuery' }
        - { $ref: '#/components/parameters/DirectoryCore' }
        - { $ref: '#/components/parameters/DirectoryGameApi' }
        - { $ref: '#/components/parameters/DirectoryPlatform' }
        - { $ref: '#/components/parameters/DirectoryArchitecture' }
        - { $ref: '#/components/parameters/DirectoryGpu' }
        - { $ref: '#/components/parameters/DirectoryChannel' }
        - { $ref: '#/components/parameters/DirectoryLicense' }
        - { $ref: '#/components/parameters/DirectoryStatus' }
      responses:
        '200':
          description: Public directory project views and recommendation reasons.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DirectoryProjectView' }
  /api/v1/directory/projects/{slug}:
    get:
      operationId: getDirectoryProject
      parameters:
        - { $ref: '#/components/parameters/DirectorySlug' }
      responses:
        '200':
          description: One public directory project view.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DirectoryProjectView' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/directory/projects/{slug}/versions/{version}:
    get:
      operationId: getDirectoryProjectVersion
      parameters:
        - { $ref: '#/components/parameters/DirectorySlug' }
        - name: version
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: One public project version with compatibility and artifact recommendation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DirectoryProjectView' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/oidc/start:
    get:
      operationId: startOidcLogin
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
        - name: invite
          in: query
          description: One-time account invitation token. Never persisted in plaintext.
          schema: { type: string }
      responses:
        '302': { description: Redirect to the configured OIDC provider. }
        '503': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: startOidcLoginWithInvitation
      description: Preferred browser form endpoint; keeps the one-time invite token out of the URL.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                returnTo: { type: string }
                invite: { type: string }
      responses:
        '302': { description: Redirect to the configured OIDC provider. }
        '503': { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/oidc/callback:
    get:
      operationId: completeOidcLogin
      responses:
        '302': { description: Set the opaque session cookie and return to the author workspace. }
        '400': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/session:
    get:
      operationId: getAuthorSession
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current private author session. Never publicly cache.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SessionPrincipal' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/logout:
    post:
      operationId: logoutAuthorSession
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [loggedOut]
                    properties:
                      loggedOut: { type: boolean }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/invitations:
    post:
      operationId: createAccountInvitation
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: One-time account invitation. Token is returned only in this response.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/InvitationWithToken' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /api/v1/auth/users/{userId}/disable:
    post:
      operationId: disableAuthorUser
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '200':
          description: User disabled and active sessions revoked. Platform admin only.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/projects:
    get:
      operationId: listAuthorProjects
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Projects visible through the current user's memberships.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuthorProject' }
        '401': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createAuthorProject
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorProjectInput' }
      responses:
        '201':
          description: Draft project and owner membership created atomically.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthorProject' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/projects/{projectId}:
    patch:
      operationId: updateAuthorProject
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorProjectPatch' }
      responses:
        '200':
          description: Updated private project draft.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthorProject' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/projects/{projectId}/versions:
    post:
      operationId: createAuthorVersion
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorVersionInput' }
      responses:
        '201':
          description: Private metadata-only version draft.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthorVersion' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/projects/{projectId}/versions/{versionId}:
    patch:
      operationId: updateAuthorVersion
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/AuthorVersionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorVersionPatch' }
      responses:
        '200':
          description: Version draft updated with optimistic revision control.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthorVersion' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/projects/{projectId}/versions/{versionId}/uploads:
    post:
      operationId: createAuthorUpload
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/AuthorVersionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorUploadInput' }
      responses:
        '201':
          description: Short-lived single-object PUT URL for quarantine storage.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthorUploadCreateResponse' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '413': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/uploads/{uploadId}:
    get:
      operationId: getAuthorUpload
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/UploadId' }
      responses:
        '200':
          description: Private upload and preflight status. Never publicly cache.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthorUpload' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/uploads/{uploadId}/complete:
    post:
      operationId: completeAuthorUpload
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/UploadId' }
      responses:
        '200':
          description: Object-storage HEAD verified and preflight queued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthorUploadCompleteResponse' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '410': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/projects/{projectId}/invitations:
    post:
      operationId: createProjectInvitation
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [maintainer, reviewer] }
      responses:
        '201':
          description: One-time project invitation. Owner only.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/InvitationWithToken' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/projects/{projectId}/invitations/{invitationId}:
    delete:
      operationId: revokeProjectInvitation
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Pending invitation revoked. }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/invitations/accept:
    post:
      operationId: acceptProjectInvitation
      security: [{ sessionCookie: [] }, { csrfToken: [] }, { idempotencyKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Invitation accepted only when its email matches the OIDC account.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthorProject' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/author/projects/{projectId}/audit:
    get:
      operationId: listProjectAuditEvents
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      responses:
        '200':
          description: Private append-only project audit summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEventSummary' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-dawnlight_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    idempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  headers:
    ETag:
      description: Strong hash of the response payload.
      schema: { type: string }
    CacheControl:
      description: Public immutable-version cache policy.
      schema: { type: string }
  parameters:
    ContractVersion:
      name: contractVersion
      in: path
      required: true
      schema: { type: string }
    FromVersion:
      name: from
      in: query
      required: true
      schema: { type: string }
    ToVersion:
      name: to
      in: query
      required: true
      schema: { type: string }
    DirectorySlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    DirectoryQuery:
      name: q
      in: query
      schema: { type: string }
    DirectoryCore:
      name: core
      in: query
      schema: { type: string }
    DirectoryGameApi:
      name: gameApi
      in: query
      schema: { type: string }
    DirectoryPlatform:
      name: platform
      in: query
      schema: { type: string }
    DirectoryArchitecture:
      name: architecture
      in: query
      schema: { type: string }
    DirectoryGpu:
      name: gpu
      in: query
      schema: { type: string }
    DirectoryChannel:
      name: channel
      in: query
      schema: { type: string }
    DirectoryLicense:
      name: license
      in: query
      schema: { type: string }
    DirectoryStatus:
      name: status
      in: query
      schema: { type: string }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuthorVersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ApiError:
      description: Explainable query error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    HealthLiveResponse:
      type: object
      required: [status, service, version, environment]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
        version: { type: string }
        environment:
          type: string
          enum: [development, test, staging, production]
    DependencyCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, failed, not-configured]
        detail: { type: string }
    HealthReadyResponse:
      type: object
      required: [status, service, version, checks]
      properties:
        status: { type: string, enum: [ready, not-ready] }
        service: { type: string }
        version: { type: string }
        checks:
          type: object
          required: [database, objectStorage]
          properties:
            database: { $ref: '#/components/schemas/DependencyCheck' }
            objectStorage: { $ref: '#/components/schemas/DependencyCheck' }
    ContractStatus:
      type: string
      enum: [preview, preview-validated, available, unavailable, deprecated]
    SourceRef:
      type: object
      required: [path, pointer, commit]
      properties:
        path: { type: string }
        pointer: { type: string }
        commit: { type: string, pattern: '^[0-9a-f]{40}$' }
    Deprecation:
      type: object
      required: [since, replacement, message]
      properties:
        since: { type: string }
        replacement: { type: [string, 'null'] }
        message: { type: string }
    ContractSummary:
      type: object
      required:
        - id
        - version
        - status
        - publicApiStatus
        - sourceRepository
        - sourceCommit
        - gameApiTag
        - manifestVersions
        - settingsSchemaVersions
        - capturedAt
        - contentDigest
      properties:
        id: { type: string }
        version: { type: string }
        status: { $ref: '#/components/schemas/ContractStatus' }
        publicApiStatus: { type: string, enum: [preview-only, stable] }
        sourceRepository: { type: string, format: uri }
        sourceCommit: { type: string, pattern: '^[0-9a-f]{40}$' }
        gameApiTag: { type: string }
        manifestVersions:
          type: array
          items: { type: integer }
        settingsSchemaVersions:
          type: array
          items: { type: integer }
        capturedAt: { type: string, format: date-time }
        contentDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
    ContractEntryBase:
      type: object
      required: [id, version, status, sourceRef, deprecation]
      properties:
        id: { type: string }
        version: { type: string }
        status: { $ref: '#/components/schemas/ContractStatus' }
        sourceRef: { $ref: '#/components/schemas/SourceRef' }
        deprecation:
          oneOf:
            - { $ref: '#/components/schemas/Deprecation' }
            - { type: 'null' }
    DiagnosticRecord:
      allOf:
        - { $ref: '#/components/schemas/ContractEntryBase' }
        - type: object
          required: [code, group, severities, catalogKinds]
          properties:
            code: { type: string }
            group: { type: string, enum: [catalog, manifest] }
            severities:
              type: array
              items: { type: string }
            catalogKinds:
              type: array
              items: { type: string }
    CatalogKind:
      type: string
      enum: [stage-template, service, semantic-provider, engine-draw-provider]
    CatalogRecord:
      allOf:
        - { $ref: '#/components/schemas/ContractEntryBase' }
        - type: object
          required: [kind]
          properties:
            kind: { $ref: '#/components/schemas/CatalogKind' }
    CapabilityRecord:
      allOf:
        - { $ref: '#/components/schemas/ContractEntryBase' }
    GraphRecord:
      allOf:
        - { $ref: '#/components/schemas/ContractEntryBase' }
        - type: object
          required: [reason, nodes, edges]
          properties:
            reason: { type: [string, 'null'] }
            nodes:
              type: array
              items: { type: object, additionalProperties: true }
            edges:
              type: array
              items: { type: object, additionalProperties: true }
    VariantRecord:
      allOf:
        - { $ref: '#/components/schemas/ContractEntryBase' }
        - type: object
          required: [reason, explanations]
          properties:
            reason: { type: [string, 'null'] }
            explanations:
              type: array
              items: { type: object, additionalProperties: true }
    ContractDiffItem:
      type: object
      required: [entity, id]
      properties:
        entity:
          type: string
          enum: [schema, diagnostic, catalog, capability, graph, variant]
        id: { type: string }
        kind: { type: string }
    ContractDiff:
      type: object
      required: [from, to, added, removed, changed]
      properties:
        from: { type: string }
        to: { type: string }
        added:
          type: array
          items: { $ref: '#/components/schemas/ContractDiffItem' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/ContractDiffItem' }
        changed:
          type: array
          items: { $ref: '#/components/schemas/ContractDiffItem' }
    DirectoryStatus:
      type: string
      enum: [preview, available, unverified, metadata-only, withdrawn, deprecated]
    DirectoryProjectView:
      type: object
      required: [id, slug, name, summary, status, visibility, latestVersion, versions, artifacts, compatibilities, images, license, recommendation, sourceRef]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        status: { $ref: '#/components/schemas/DirectoryStatus' }
        visibility: { type: string, enum: [public-candidate, published] }
        latestVersion:
          oneOf:
            - { $ref: '#/components/schemas/DirectoryProjectVersion' }
            - { type: 'null' }
        versions:
          type: array
          items: { $ref: '#/components/schemas/DirectoryProjectVersion' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/DirectoryArtifact' }
        compatibilities:
          type: array
          items: { $ref: '#/components/schemas/DirectoryCompatibility' }
        images:
          type: array
          items: { $ref: '#/components/schemas/DirectoryImage' }
        license:
          oneOf:
            - { $ref: '#/components/schemas/DirectoryLicense' }
            - { type: 'null' }
        recommendation:
          $ref: '#/components/schemas/DirectoryRecommendation'
        sourceRef: { $ref: '#/components/schemas/SourceRef' }
    DirectoryProjectVersion:
      type: object
      required: [id, projectId, version, channel, status, verification, contractVersion, coreCommit, gameApiTag, manifestVersion, settingsSchemaVersion, compatibilityIds, artifactIds, imageIds, sourceRef]
      properties:
        id: { type: string }
        projectId: { type: string }
        version: { type: string }
        channel: { type: string, enum: [preview, stable, beta, alpha] }
        status: { $ref: '#/components/schemas/DirectoryStatus' }
        verification: { type: string, enum: [schema-only, loader-verified, device-verified] }
        contractVersion: { type: string }
        coreCommit: { type: string, pattern: '^[0-9a-f]{40}$' }
        gameApiTag: { type: string }
        manifestVersion: { type: integer }
        settingsSchemaVersion: { type: integer }
        compatibilityIds: { type: array, items: { type: string } }
        artifactIds: { type: array, items: { type: string } }
        imageIds: { type: array, items: { type: string } }
        sourceRef: { $ref: '#/components/schemas/SourceRef' }
    DirectoryArtifact:
      type: object
      required: [id, projectVersionId, status, platform, architecture, gpuClass, fileName, size, sha256, downloadUrl, sourceRef]
      properties:
        id: { type: string }
        projectVersionId: { type: string }
        status: { type: string, enum: [available, unverified, quarantine, withdrawn] }
        platform: { type: string }
        architecture: { type: string }
        gpuClass: { type: string }
        fileName: { type: string }
        size: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        downloadUrl: { type: string, format: uri }
        sourceRef: { $ref: '#/components/schemas/SourceRef' }
    DirectoryCompatibility:
      type: object
      required: [id, projectVersionId, status, coreRange, gameApiTag, platforms, architectures, gpuClasses, reason]
      properties:
        id: { type: string }
        projectVersionId: { type: string }
        status: { type: string, enum: [unverified, compatible, incompatible, partial] }
        coreRange: { type: string }
        gameApiTag: { type: string }
        platforms: { type: array, items: { type: string } }
        architectures: { type: array, items: { type: string } }
        gpuClasses: { type: array, items: { type: string } }
        reason: { type: string }
    DirectoryImage:
      type: object
      required: [id, projectVersionId, status, url, alt, reason]
      properties:
        id: { type: string }
        projectVersionId: { type: string }
        status: { type: string, enum: [available, unavailable] }
        url: { type: [string, 'null'], format: uri }
        alt: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
    DirectoryLicense:
      type: object
      required: [id, projectId, status, spdxId, name, url, reason]
      properties:
        id: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [declared, unknown, restricted] }
        spdxId: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        url: { type: [string, 'null'], format: uri }
        reason: { type: string }
    DirectoryRecommendation:
      type: object
      required: [artifact, reasons, exclusions]
      properties:
        artifact:
          oneOf:
            - { $ref: '#/components/schemas/DirectoryArtifact' }
            - { type: 'null' }
        reasons: { type: array, items: { type: string } }
        exclusions: { type: array, items: { type: string } }
    AuthUser:
      type: object
      required: [id, displayName, email, status, isPlatformAdmin]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, disabled, deletion-requested] }
        isPlatformAdmin: { type: boolean }
    SessionPrincipal:
      type: object
      required: [sessionId, csrfToken, expiresAt, user]
      properties:
        sessionId: { type: string, format: uuid }
        csrfToken:
          type: string
          description: Per-session CSRF token. It is not an authentication credential.
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/AuthUser' }
    AuthorCompatibilityDraft:
      type: object
      required: [coreRange, gameApiTag, platforms, architectures, gpuClasses, note]
      properties:
        coreRange: { type: string }
        gameApiTag: { type: string }
        platforms: { type: array, items: { type: string } }
        architectures: { type: array, items: { type: string } }
        gpuClasses: { type: array, items: { type: string } }
        note: { type: string }
    AuthorArtifactDeclaration:
      type: object
      description: Metadata declaration only. It is not an upload or published artifact.
      required: [fileName, platform, architecture, gpuClass, expectedSize]
      properties:
        fileName: { type: string }
        platform: { type: string }
        architecture: { type: string }
        gpuClass: { type: string }
        expectedSize: { type: [integer, 'null'], minimum: 1, maximum: 536870912 }
    AuthorVersion:
      type: object
      required: [id, projectId, version, channel, status, changelog, licenseSpdx, compatibility, artifactDeclarations, revision, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        version: { type: string }
        channel: { type: string, enum: [preview, alpha, beta, stable] }
        status: { type: string, enum: [draft, changes-requested] }
        changelog: { type: string }
        licenseSpdx: { type: [string, 'null'] }
        compatibility:
          type: array
          items: { $ref: '#/components/schemas/AuthorCompatibilityDraft' }
        artifactDeclarations:
          type: array
          items: { $ref: '#/components/schemas/AuthorArtifactDeclaration' }
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    AuthorProject:
      type: object
      required: [id, slug, name, summary, licenseSpdx, status, role, updatedAt, versions]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        licenseSpdx: { type: [string, 'null'] }
        status: { type: string, enum: [draft, archived] }
        role: { type: string, enum: [owner, maintainer, reviewer] }
        updatedAt: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: '#/components/schemas/AuthorVersion' }
    AuthorProjectInput:
      type: object
      required: [slug, name, summary, licenseSpdx]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        name: { type: string, minLength: 2, maxLength: 100 }
        summary: { type: string, minLength: 10, maxLength: 500 }
        licenseSpdx: { type: [string, 'null'] }
    AuthorProjectPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        summary: { type: string, minLength: 10, maxLength: 500 }
        licenseSpdx: { type: [string, 'null'] }
        status: { type: string, enum: [draft, archived] }
    AuthorVersionInput:
      type: object
      required: [version, channel, changelog, licenseSpdx, compatibility, artifactDeclarations]
      properties:
        version: { type: string }
        channel: { type: string, enum: [preview, alpha, beta, stable] }
        changelog: { type: string, maxLength: 20000 }
        licenseSpdx: { type: [string, 'null'] }
        compatibility:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/AuthorCompatibilityDraft' }
        artifactDeclarations:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/AuthorArtifactDeclaration' }
    AuthorVersionPatch:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        channel: { type: string, enum: [preview, alpha, beta, stable] }
        changelog: { type: string, maxLength: 20000 }
        licenseSpdx: { type: [string, 'null'] }
        compatibility:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/AuthorCompatibilityDraft' }
        artifactDeclarations:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/AuthorArtifactDeclaration' }
    AuthorUploadInput:
      type: object
      required: [fileName, size, contentType]
      properties:
        fileName: { type: string, maxLength: 160, pattern: '^.+\\.zip$' }
        size: { type: integer, minimum: 1, maximum: 536870912 }
        contentType:
          type: string
          enum: [application/zip, application/x-zip-compressed, application/octet-stream]
    AuthorUploadCreateResponse:
      type: object
      required: [uploadId, method, uploadUrl, expiresAt, maxBytes, requiredHeaders]
      properties:
        uploadId: { type: string, format: uuid }
        method: { type: string, enum: [PUT] }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer }
        requiredHeaders:
          type: object
          required: [content-type]
          properties:
            content-type: { type: string }
    PreflightDiagnostic:
      type: object
      required: [code, severity, path, message]
      properties:
        code: { type: string }
        severity: { type: string, enum: [error, warning] }
        path: { type: [string, 'null'] }
        message: { type: string }
    PreflightManifestEntry:
      type: object
      required: [path, size, compressedSize, sha256]
      properties:
        path: { type: string }
        size: { type: integer }
        compressedSize: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    AuthorUpload:
      type: object
      required: [id, projectId, versionId, fileName, expectedSize, contentType, status, expiresAt, objectSize, inputSha256, fileCount, extractedSize, manifest, diagnostics, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        fileName: { type: string }
        expectedSize: { type: integer }
        contentType: { type: string }
        status: { type: string, enum: [created, queued, inspecting, passed, rejected, infrastructure-error, expired] }
        expiresAt: { type: string, format: date-time }
        objectSize: { type: [integer, 'null'] }
        inputSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        fileCount: { type: [integer, 'null'] }
        extractedSize: { type: [integer, 'null'] }
        manifest: { type: array, items: { $ref: '#/components/schemas/PreflightManifestEntry' } }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/PreflightDiagnostic' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthorUploadCompleteResponse:
      type: object
      required: [uploadId, status, objectSize]
      properties:
        uploadId: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
        objectSize: { type: integer }
    InvitationWithToken:
      type: object
      required: [id, email, expiresAt, token]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [maintainer, reviewer] }
        status: { type: string, enum: [pending] }
        expiresAt: { type: string, format: date-time }
        token:
          type: string
          description: One-time plaintext token, returned only on creation.
    AuditEventSummary:
      type: object
      required: [id, action, outcome, requestId, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        outcome: { type: string, enum: [allowed, denied, failed] }
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
