name: dawnlight-v2-dev

services:
  postgres:
    image: postgres:16.4-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: dawnlight
      POSTGRES_PASSWORD: dawnlight
      POSTGRES_DB: dawnlight_v2
    volumes:
      - dawnlight-v2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawnlight -d dawnlight_v2"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":59001"
    ports:
      - "59000:9000"
      - "59001:59001"
    environment:
      MINIO_ROOT_USER: dawnlight-local
      MINIO_ROOT_PASSWORD: dawnlight-local-secret
    volumes:
      - dawnlight-v2-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 dawnlight-local dawnlight-local-secret &&
      mc mb --ignore-existing local/dawnlight-quarantine &&
      mc mb --ignore-existing local/dawnlight-published &&
      mc mb --ignore-existing local/dawnlight-derived &&
      mc anonymous set none local/dawnlight-quarantine &&
      mc anonymous set none local/dawnlight-published &&
      mc anonymous set none local/dawnlight-derived"

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:4.0.0
    ports:
      - "59002:8080"
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"dawnlight","requestMappings":[{"requestParam":"subject","match":".*","claims":{"sub":"$${subject}","name":"$${subject}","email":"$${subject}@example.test","email_verified":true,"aud":["dawnlight-web"]}}]}]}

volumes:
  dawnlight-v2-postgres:
  dawnlight-v2-minio:
